<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>MHA Project</title>
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
    <meta http-equiv="refresh" content="10">
  </head>

  <body>
      <header>
        
          <div class="user-profile">
            <img src="{{ url_for('static', filename='img/avatar.jpg') }}"  alt="User" class="avatar">
            <span>{{ username }} خوش آمدید </span>
            <span class="arrow">▾</span>
          </div>

          <nav>
            <div>
              <a href="/home">خانه</a>
              <a href="/cam">دوربین ها</a>
              <a href="#">تنظیمات</a>
            </div>
          </nav>
          
          <div class="logo">
            <img  src="{{ url_for('static', filename='img/logoGB.PNG') }}"  alt="User" class="avatar">
          </div>
      </header>

      <aside class="sidebar" id="sidebar"class="topbar">
        <button id="toggleBtn" class="toggle-btn" aria-label="Toggle sidebar">
          <i class="fas fa-angle-left"></i>
        </button>
      </div>

      <!-- بخش ناوبری: آیتم‌های منو -->
      <nav class="nav">
        <ul>
          <li data-label="Dashboard">
            <a href="/home"><i class="fas fa-home"></i><span class="label">داشبورد</span></a>
          </li>
          <li data-label="Camera">
            <a href="#"><i class="fa-solid fa-camera"></i><span class="label">دوربین</span></a>
          </li>
          <li data-label="Messages">
            <a href="#"><i class="fas fa-envelope"></i><span class="label">پیام‌ها</span></a>
          </li>
          <li data-label="Analytics">
            <a href="#"><i class="fas fa-chart-bar"></i><span class="label">تحلیل</span></a>

    <b>FRAGILE</b>
    
  </body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRAGILE | دوربین‌ها</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- سایدبار -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <a href="/home"><i class="fas fa-home"></i><span class="label">داشبورد</span></a>
      <a href="/cam" class="active"><i class="fa-solid fa-camera"></i><span class="label">دوربین</span></a>
      <a href="#"><i class="fas fa-envelope"></i><span class="label">پیام‌ها</span></a>
      <a href="#"><i class="fas fa-chart-bar"></i><span class="label">تحلیل</span></a>
      <a href="#"><i class="fas fa-cog"></i><span class="label">تنظیمات</span></a>
      <a href="#"><i class="fas fa-bell"></i><span class="label">اعلان‌ها</span></a>
      <a href="#"><i class="fas fa-user"></i><span class="label">پروفایل</span></a>
      <a href="#"><i class="fas fa-sign-out-alt"></i><span class="label">خروج</span></a>
    </nav>
  </aside>

  <!-- محتوای اصلی -->
  <div class="main-content">
    <header>
      <div class="logo">
        <button id="toggleBtn" class="menu-btn">
          <i class="fa fa-bars"></i>
        </button>
        <img src="{{ url_for('static', filename='img/logoGB.PNG') }}" alt="Logo">
      </div>

      <nav class="top-nav">
        <a href="/home">خانه</a>
        <a href="/cam" class="active">دوربین‌ها</a>
        <a href="#">تنظیمات</a>
      </nav>

      <div class="user-profile">
        <img src="{{ url_for('static', filename='img/avatar.jpg') }}" alt="User">
        <span>{{ username }} خوش آمدید</span>
        <span class="arrow">down arrow</span>
      </div>
    </header>

    <!-- FRAGILE -->
    <div class="fragile">
      <h4><b class="FRA">FRA</b><b class="GILE">GILE</b></h4>
      <hr>
      <h6>دوربین‌های زنده</h6>
    </div>

    <!-- دوربین‌ها -->
    <main class="cams">
      <div class="live">
        <video autoplay muted loop>
          <source src="{{ url_for('static', filename='img/test4.mp4') }}" type="video/mp4">
        </video>
        <p>دوربین ۱</p>
      </div>
      <div class="live">
        <video autoplay muted loop>
          <source src="{{ url_for('static', filename='img/test3.mp4') }}" type="video/mp4">
        </video>
        <p>دوربین ۲</p>
      </div>
      <div class="live">
        <video autoplay muted loop>
          <source src="{{ url_for('static', filename='img/test4.mp4') }}" type="video/mp4">
        </video>
        <p>دوربین ۳</p>
      </div>
      <div class="live">
        <video autoplay muted loop>
          <source src="{{ url_for('static', filename='img/test3.mp4') }}" type="video/mp4">
        </video>
        <p>دوربین ۴</p>
      </div>
      <div class="live">
        <img src="http://192.168.124.60:8080/video" alt="دوربین موبایل">
        <p>LIVE Cam موبایل</p>
      </div>
    </main>
  </div>

  <!-- JS برای منو -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      const icon = toggleBtn.querySelector('i');
      icon.classList.toggle('fa-bars');
      icon.classList.toggle('fa-times');
    });
  </script>

</body>
</html>
